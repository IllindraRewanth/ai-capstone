<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account settings</title>
  <link rel="stylesheet" href="/settings.css" />
</head>
<body>
  <main class="settings-page">
    <h1 id="settings-heading">Account settings</h1>
    <p class="settings-lede">Update how we show your name and whether we email you.</p>

    <form id="settingsForm" novalidate aria-labelledby="settings-heading">
      <div class="field">
        <label for="displayName">Display name</label>
        <input
          type="text"
          id="displayName"
          name="displayName"
          autocomplete="name"
          maxlength="80"
          required
          aria-describedby="displayName-error"
        />
        <p class="field-error" id="displayName-error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
          aria-describedby="email-error"
        />
        <p class="field-error" id="email-error" role="alert" hidden></p>
      </div>

      <fieldset class="field fieldset-plain">
        <legend>Notifications</legend>
        <label class="checkbox-row">
          <input type="checkbox" id="notifications" name="notifications" />
          Send product updates by email
        </label>
      </fieldset>

      <button type="submit" id="saveButton">Save settings</button>
    </form>

    <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
  </main>
  <script src="/settings.js" defer></script>
</body>
</html>
